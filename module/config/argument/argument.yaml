BrowndustSummon:
  Draw: true
# 活动。一期的五件事全在这一个任务里，按「剧情 → 活动战斗 → 魔兽追踪者 →
# 活动任务 → 活动商店」的顺序跑完（先挣后花、失败代价从小到大）。
# 下面两组是其中需要你拿主意的：战斗打哪个模式、兑换按什么优先级。
BrowndustEvent:
  # 普通战斗和挑战战斗共用每天 5 次 AP。只开一个模式时那 5 次全给它；
  # 两个都开就各打 `Times` 次，否则先打的那个会把 AP 吃光。
  BattleMode:
    value: Normal
    option: [ Normal, Challenge, Both ]
  Times:
    value: 3
    argtype: integer
    validate: [ 1, 5 ]
  # 活动商店的兑换优先级清单：`>` 分隔、前面优先、**没写的就是不买**
  # （和碧蓝的自定义过滤器同一个形状）。可用代号：
  #   Paid           价格是钻石的那几档（默认不写 —— 想花钱买就把它加到最前面）
  #   EquipUR / EquipSR   活动限定装备，靠名字里的 (UR)/(SR) 后缀认，换期不用改
  #   EquipMaterial  活动限定装备的强化材料，认"紧挨着装备右边"那一格
  #   GachaTicket / GoddessTear / AncientCrystal / RefineCrystal / Essence / Star4
  # 除此之外的项按**商品名子串**匹配，所以换期想知道这期的材料叫什么，直接写名字
  # （比如 `魔法之丝`）也能用。
  ShopFilter:
    value: 'GachaTicket > GoddessTear > EquipUR > EquipSR > EquipMaterial > AncientCrystal > Essence > RefineCrystal > Star4'
  # 买满限量（MAX，游戏会按余额截断，不会超支）还是只买一个。
  BuyAmount:
    value: max
    option: [ max, one ]
BrowndustHunt:
  HuntField: 5
  HuntCoin: 5
  HuntSlime: 5
  CaveFire: 2
  CaveWater: 2
  CaveWind: 2
  CaveLight: 2
  CaveDark: 2

# ==================== Chaos Zero Nightmare (卡厄思梦境) ====================

ChaoszeroSimulation:
  # 战斗训练左侧那六个页签，从上到下。全开就六个都刷一遍，顺序就是这里的顺序。
  TrainingGrowth: true
  TrainingMember: false
  TrainingPartner: false
  TrainingPotential: true
  TrainingMemory: false
  TrainingChallenge: false
  # 每个页签打第几项：右侧列表从上往下数，一屏四行（1-4），往下还有行就接着数
  # 5、6…（記憶碎片 11 行、戰鬥員/夥伴 6 行、潛力 5 行、成長 3 行、挑戰 2 行）。
  # 四个页签共用这一个序号；哪个页签没这么多行就跳过它。
  TrainingStage: 1
  # 难度 1-6；0 = 不动它，用游戏里当前选中的那个。
  TrainingDifficulty: 0
  # 战斗效率 1-6：一次打几场，消耗 = 单场体力 × 效率。清体力用 6。
  TrainingEfficiency: 6
  # 每个页签打几轮，0 = 一直打到体力不够或次数用完为止。
  TrainingTimes: 0

ChaoszeroArk:
  # 政策室开关。
  PolicyEnable: true
  # 批准几份政策：0 = 能批多少批多少（批到卡叠空为止），N = 最多 N 份。
  # **每批准一份消耗一天**（左上「倒數」会减 1），所以批光会很快烧天数。
  PolicyTimes: 0
  # 两份文件里盖哪一份。auto = 按奖励挑：额外奖励多的优先（政策點數不算数）。
  PolicySide:
    value: auto
    option: [ auto, left, right ]
  # 咖啡廳：每天点一次餐（內用 +120 體力）。今天点过了菜单就不再弹出，正常退出。
  CafeOrder: true
