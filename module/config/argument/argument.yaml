  Draw: true
# 活动。一期的五件事全在这一个任务里，按「剧情 → 活动战斗 → 魔兽追踪者 →
# 活动任务 → 活动商店」的顺序跑完（先挣后花、失败代价从小到大）。
# 下面两组是其中需要你拿主意的：战斗打哪个模式、兑换按什么优先级。
BrowndustEvent:
  # 普通战斗和挑战战斗共用每天 5 次 AP。只开一个模式时那 5 次全给它；
  # 两个都开就各打 `Times` 次，否则先打的那个会把 AP 吃光。
  BattleMode:
    value: Normal
    option: [ Normal, Challenge, Both ]
  Times:
    value: 3
    argtype: integer
    validate: [ 1, 5 ]
  # 活动商店的兑换优先级清单：`>` 分隔、前面优先、**没写的就是不买**
  # （和碧蓝的自定义过滤器同一个形状）。可用代号：
  #   Paid           价格是钻石的那几档（默认不写 —— 想花钱买就把它加到最前面）
  #   EquipUR / EquipSR   活动限定装备，靠名字里的 (UR)/(SR) 后缀认，换期不用改
  #   EquipMaterial  活动限定装备的强化材料，认"紧挨着装备右边"那一格
  #   GachaTicket / GoddessTear / AncientCrystal / RefineCrystal / Essence / Star4
  # 除此之外的项按**商品名子串**匹配，所以换期想知道这期的材料叫什么，直接写名字
  # （比如 `魔法之丝`）也能用。
  ShopFilter:
    value: 'GachaTicket > GoddessTear > EquipUR > EquipSR > EquipMaterial > AncientCrystal > Essence > RefineCrystal > Star4'
  # 买满限量（MAX，游戏会按余额截断，不会超支）还是只买一个。
  BuyAmount:
    value: max
    option: [ max, one ]
BrowndustHunt:
  HuntField: 5
  HuntCoin: 5
  HuntSlime: 5
  CaveFire: 2
  CaveWater: 2
  CaveWind: 2
  CaveLight: 2
  CaveDark: 2

# ==================== Chaos Zero Nightmare (卡厄思梦境) ====================

ChaoszeroSimulation:
  # 战斗训练左侧那六个页签，从上到下。全开就六个都刷一遍，顺序就是这里的顺序。
  TrainingGrowth: true
  TrainingMember: false
  TrainingPartner: false
  TrainingPotential: true
  TrainingMemory: false
  TrainingChallenge: false
  # 每个页签打第几项：右侧列表从上往下数，一屏四行（1-4），往下还有行就接着数
  # 5、6…（記憶碎片 11 行、戰鬥員/夥伴 6 行、潛力 5 行、成長 3 行、挑戰 2 行）。
  # 四个页签共用这一个序号；哪个页签没这么多行就跳过它。
  TrainingStage: 1
  # 难度 1-6；0 = 不动它，用游戏里当前选中的那个。
  TrainingDifficulty: 0
  # 战斗效率 1-6：一次打几场，消耗 = 单场体力 × 效率。清体力用 6。
  TrainingEfficiency: 6
  # 每个页签打几轮，0 = 一直打到体力不够或次数用完为止。
  TrainingTimes: 0

ChaoszeroArk:
  # 政策室开关。
  PolicyEnable: true
  # 批准几份政策：0 = 能批多少批多少（批到卡叠空为止），N = 最多 N 份。
  # **每批准一份消耗一天**（左上「倒數」会减 1），所以批光会很快烧天数。
  PolicyTimes: 0
  # 两份文件里盖哪一份。auto = 按奖励挑：额外奖励多的优先（政策點數不算数）。
  PolicySide:
    value: auto
    option: [ auto, left, right ]
  # 咖啡廳：每天点一次餐（內用 +120 體力）。今天点过了菜单就不再弹出，正常退出。
  CafeOrder: true
  # 諾諾商店：从上往下买，每件按 MAX 买满限量。
  # 不买「單元幣」；「購買」灰掉的（持有量超上限、钱不够）跳过。
  ShopPurchase: true


# ==================== Cross Core (交错战线) ====================

CrosscoreExplore:
  # 每日探索只刷一个子项（用户要求：不分散体力）。脚本进「出击 → 每日探索」，
  # 选这一个子项，再选它的最高已解锁层，把体力扫荡完。
  Explore:
    value: 技能磨砺
    option: [ 技能磨砺, 星币开采, 技术分析, 荒墟拾遗, 鼓舞嵌合, 光枢嵌合, 注刘嵌合, 链接嵌合, 体魄嵌合, 侵蚀嵌合, 迅刃嵌合, 矛盾嵌合, 自然跃升, 人造跃升, 生命跃升 ]

CrosscoreBase:
  # 一队 / 二队各值班多少小时。到点才换班：脚本读预设面板的绿色「工作中」
  # 判断当前是哪一队，配合本地记录的上次换班时间，够时才换成另一队。
  # 换完之后按新队伍自己的时长排下一次运行。
  Team1Hours: 15.5
  Team2Hours: 8.5


# ==================== Star Savior (星之救援者) ====================
# 刷初始工具的配置。**这个任务不进调度器**（`task.yaml` 里写的是 `page: 'tool'`），
# 只有在 WebUI 的「工具」页手动 Start 才会跑；跑完即退出，不占用任务队列。

Starsavior2:
  # 自定义昵称：留空就每次随机一个 10 位的字母+数字组合。
  # ❗**不能带任何单词前缀**：`Savior` + 4 位数字会被游戏判「包含无法使用的字」，
  #   确认键怎么点都不走（真机 2026-11-07 23:30，用户要求改纯随机）。
  # 游戏只收 4~16 个字符，英文/数字以外的字符会被脚本过滤掉；
  # 过滤完不够 4 个字就退回随机名（游戏对重名/怪字符会直接判「非法」）。
  Nickname:
    value: ''
    valuetype: str
  # 达标条件：挂上的目标要「某一个角色凑够它自己的数量就停」，还是「选上的全都要刷出来才算」。
  #   any = 任意一个角色：挂七个等于把这七只的概率加起来，哪只凑够都算，最省时间（默认）
  #   all = 全部都要：每一只都得凑够各自的数量，缺一只就重置重来
  #         例：4 只 A + 1 只 B，两个条件同时满足才停。
  TargetMode:
    value: any
    option: [ any, all ]
  # 目标角色：卡池 SSR 名单，抄自 `assets/starsavior/roster.txt`（46 只）。
  #
  # ❗**最多可以挂 7 只**（`Target` + `Target2`~`Target7`），判定方式跟着上面的
  #   `TargetMode` 走：`any` 只看有没有某一个角色凑够它自己的数量，`all` 要求每一只都凑够。
  # 挂了目标就一轮轮刷到为止（达标停下、把号留在游戏里；没达标就自动重置再刷）；
  # 七只全留「不指定」就只跑一轮，验号完停下、**不重置**。
  Target:
    value: none
    option: &ssr_pool [
      none,
      '瑟莱丝@锐利甜心',
      '露娜@航行者救援团',
      '卡奈莉亚@流浪者',
      '赛拉@梦魇',
      '艾莉莎@莫诺利斯教团',
      '莉迪亚@西部收复部队',
      '莱希@流浪者',
      '亚瑟菈@星光华尔兹',
      '阿莫拉@斯特拉尼斯伯爵家',
      '罗莎莉亚@堕落之鹰',
      '亚瑟菈@航行者救援团',
      '微笑@航行者救援团',
      '贝尔·莉丝@烛光广场',
      '埃米莉@烛光广场',
      '夏尔@莫纳斯提尔骑士团',
      '卡蜜@莫纳斯提尔骑士团',
      '芙蕾@莫纳斯提尔骑士团',
      '崔瑞丝@阿塞卢斯协会',
      '凌@风月堂',
      '克莉丝特@莫雷尔海运商会',
      '艾黛@莫雷尔海运商会',
      '瑟乐芬@风月堂',
      '达娜@卡诺普斯警备队',
      '缪莉尔@莫诺利斯教团',
      '缇莉雅@执行者',
      '萝贝塔@轨道搜索队',
      '卢格@轨道搜索队',
      '霏@流浪者',
      '艾芬黛尔@奥尔兰家族',
      '奥米嘉@航行者救援团',
      '夏尔@莫纳斯提尔之心',
      '瑟莱丝@西部收复部队',
      'M教授@兰帕迪斯',
      '哈莉@地狱救援者',
      '佩特拉@佩特拉联合',
      '丝卡蕾@小暴君',
      '克莱儿@无瑕蓝玫瑰',
      '露娜@白珍珠',
      '微笑@阳光猫娘',
      '塔妮娅@佩特拉联合',
      '莉莉@兰帕迪斯',
      '绮拉@绮拉根本没有朋友',
      '艾芬黛尔@花绽祝福',
      '芙蕾@贵族公主',
      '希尔德@芬里尔小队',
      '刘米娜@芬里尔小队',
    ]
  # 目标角色 2~7：和上面同一份卡池名单（`option: *ssr_pool`，换池子只改上面那一份）。
  # 留「不指定」就是不在这一位挂目标；七个位填满就是七只候选。
  Target2:
    value: none
    option: *ssr_pool
  Target3:
    value: none
    option: *ssr_pool
  Target4:
    value: none
    option: *ssr_pool
  Target5:
    value: none
    option: *ssr_pool
  Target6:
    value: none
    option: *ssr_pool
  Target7:
    value: none
    option: *ssr_pool
  # 每个目标各自要几只（1 = 本体 0 星，4 = 满星）。
  # `TargetCount` 配第 1 个目标，`TargetCount2`~`TargetCount7` 依次配后面的；
  # 没挂目标的位填了也不起作用。`all` 模式下这里是硬条件（4 只就是真有 4 只）。
  TargetCount: 1
  TargetCount2: 1
  TargetCount3: 1
  TargetCount4: 1
  TargetCount5: 1
  TargetCount6: 1
  TargetCount7: 1
  # 停节点：调试 / 分段跑用，**和「目标角色」只能填一个**（填了节点就按节点跑）。
  #   none     = 不中途停（默认，= 重复跑：挂了目标就一轮轮刷到出，没挂就只跑一轮）
  #   nickname = 节点1：到昵称输入框停下（不输入昵称）
  #   guide    = 节点2：所有引导走完停下（还没领奖励、没抽卡）
  #   verify   = 节点3：一直跑到验号
  StopAt:
    value: none
    option: [ none, nickname, guide, verify ]
