# --------------------
# Define non-modifiable values
# --------------------

# ==================== Framework ====================

Restart:
  Scheduler:
    Enable:
      type: state
      value: true
      option: [ true, ]
      option_bold: [ true, ]
    SuccessInterval: 0
    FailureInterval: 0
    # Daily reset of the game, the restart runs at this time.
    # Change it when you add a game with a different reset hour.
    ServerUpdate: 05:00

# ==================== Lost Sword (失落之剑) ====================

# The game day turns over at 23:00 (user-confirmed), so every daily task of
# this game runs on a 23:00 clock instead of the framework default of 05:00.
# Quoted on purpose: bare `23:00` is read by YAML 1.1 as sexagesimal 1380.
LostswordMain:
  Scheduler:
    ServerUpdate: '23:00'
LostswordBoss:
  Scheduler:
    ServerUpdate: '23:00'
LostswordDungeon:
  Scheduler:
    ServerUpdate: '23:00'
LostswordEvent:
  Scheduler:
    ServerUpdate: '23:00'
# 星辰轮回 is a weekly mode: it schedules itself onto the Monday 00:00 reset, so
# this hour is only a fallback for a failure retry. It stays on 23:00 to match
# the game's own daily reset.
LostswordStar:
  Scheduler:
    ServerUpdate: '23:00'
LostswordAvalon:
  Scheduler:
    ServerUpdate: '23:00'
LostswordCopy:
  Scheduler:
    ServerUpdate: '23:00'
LostswordMaze:
  Scheduler:
    ServerUpdate: '23:00'
LostswordArena:
  Scheduler:
    ServerUpdate: '23:00'
LostswordRound:
  Scheduler:
    ServerUpdate: '23:00'
LostswordAffection:
  Scheduler:
    ServerUpdate: '23:00'
LostswordMail:
  Scheduler:
    ServerUpdate: '23:00'
LostswordGuild:
  Scheduler:
    ServerUpdate: '23:00'
LostswordShop:
  Scheduler:
    ServerUpdate: '23:00'
LostswordTreasure:
  Scheduler:
    ServerUpdate: '23:00'
LostswordTask:
  Scheduler:
    ServerUpdate: '23:00'
LostswordSummon:
  Scheduler:
    ServerUpdate: '23:00'
# 通行证 was added later than the tasks above and was left out of this file, so
# it kept the framework default 05:00 and every config_update (WebUI save,
# `python -m module.config.config_updater`) wrote 05:00 back over the value.
LostswordPass:
  Scheduler:
    ServerUpdate: '23:00'
# 兑换码 follows the game day like every other task of this game (user,
# 2026-11-04: align it with the daily reset). The code list only ever returns
# codes that have not expired yet, so the hour only decides how soon a new code
# is noticed - the reset hour is the earliest sensible slot.
LostswordRedeem:
  Scheduler:
    # Quoted on purpose: a bare `10:00` is read as the sexagesimal number 600,
    # and the generator then refuses it as "not a string".
    ServerUpdate: '23:00'

# ==================== Brown Dust II (棕色尘埃2) ====================

# The game day turns over at 08:00 (user-confirmed). Every task of this game is
# a once-a-day claim, so a single run right after the reset covers the day.
BrowndustSummon:
  Scheduler:
    ServerUpdate: 08:00
BrowndustHunt:
  Scheduler:
    ServerUpdate: 08:00
BrowndustMail:
  Scheduler:
    ServerUpdate: 08:00
BrowndustManager:
  Scheduler:
    ServerUpdate: 08:00
BrowndustTask:
  Scheduler:
    ServerUpdate: 08:00
BrowndustEvent:
  Scheduler:
    ServerUpdate: 08:00
BrowndustPass:
  Scheduler:
    ServerUpdate: 08:00
BrowndustRedeem:
  Scheduler:
    # Follows the 08:00 reset of this game like the other tasks (user,
    # 2026-11-04). Quoted for the same reason as above: a bare `08:00` is fine
    # but a bare `10:30` would not be.
    ServerUpdate: '08:00'

# ==================== Trickcal (嘟嘟脸恶作剧) ====================

# Double daily runs at 05:00 and 18:00 (user-confirmed) for collection and
# stamina-consuming tasks.
TrickcalFriend:
