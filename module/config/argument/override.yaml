# --------------------
# Define non-modifiable values
# --------------------

# ==================== Framework ====================

Restart:
  Scheduler:
    Enable:
      type: state
      value: true
      option: [ true, ]
      option_bold: [ true, ]
    SuccessInterval: 0
    FailureInterval: 0
    # Daily reset of the game, the restart runs at this time.
    # Change it when you add a game with a different reset hour.
    ServerUpdate: 05:00

# ==================== Lost Sword (失落之剑) ====================

# The game day turns over at 00:00, so every daily task of this game runs on a
# 00:00 clock instead of the framework default of 05:00. Hazeworld keeps the
# default: the hour belongs to the game, not to the script.
LostswordMain:
  Scheduler:
    ServerUpdate: 00:00
LostswordBoss:
  Scheduler:
    ServerUpdate: 00:00
LostswordDungeon:
  Scheduler:
    ServerUpdate: 00:00
LostswordEvent:
  Scheduler:
    ServerUpdate: 00:00
LostswordStar:
  Scheduler:
    ServerUpdate: 00:00
LostswordCopy:
  Scheduler:
    ServerUpdate: 00:00
LostswordMaze:
  Scheduler:
    ServerUpdate: 00:00
LostswordArena:
  Scheduler:
    ServerUpdate: 00:00
LostswordRound:
  Scheduler:
    ServerUpdate: 00:00
LostswordAffection:
  Scheduler:
    ServerUpdate: 00:00
LostswordMail:
  Scheduler:
    ServerUpdate: 00:00
LostswordShop:
  Scheduler:
    ServerUpdate: 00:00
LostswordTreasure:
  Scheduler:
    ServerUpdate: 00:00
LostswordTask:
  Scheduler:
    ServerUpdate: 00:00
LostswordSummon:
  Scheduler:
    ServerUpdate: 00:00

# ==================== Brown Dust II (棕色尘埃2) ====================

# The game day turns over at 08:00 (user-confirmed). Every task of this game is
# a once-a-day claim, so a single run right after the reset covers the day.
BrowndustSummon:
  Scheduler:
    ServerUpdate: 08:00
BrowndustHunt:
  Scheduler:
    ServerUpdate: 08:00
BrowndustMail:
  Scheduler:
    ServerUpdate: 08:00
BrowndustManager:
  Scheduler:
    ServerUpdate: 08:00
BrowndustTask:
  Scheduler:
    ServerUpdate: 08:00
BrowndustPass:
  Scheduler:
    ServerUpdate: 08:00
