<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>卡厄思 · 事件偏好选择器</title>
<style>
  :root {
    --bg: #10141b; --panel: #171d27; --line: #232c3a; --text: #d7dee9;
    --dim: #7b879b; --accent: #4da3ff; --ok: #38c172; --warn: #e3a008; --bad: #e3342f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font: 14px/1.6 "Segoe UI", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text);
    height: 100vh; display: flex; flex-direction: column;
  }
  header {
    position: sticky; top: 0; z-index: 10; background: var(--panel);
    border-bottom: 1px solid var(--line); padding: 10px 18px;
    display: flex; gap: 14px; align-items: center; flex-wrap: wrap;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header .grow { flex: 1; }
  #search {
    min-width: 12em; max-width: 100%; padding: 6px 9px;
    border: 1px solid #49576d; border-radius: 6px; background: var(--bg); color: var(--text);
  }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button {
    background: #222c3b; color: var(--text); border: 1px solid var(--line);
    border-radius: 6px; padding: 6px 12px; cursor: pointer; font-size: 13px;
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: #08111d; border-color: var(--accent); font-weight: 600; }
  main { display: flex; flex: 1; min-height: 0; }
  nav {
    width: 210px; border-right: 1px solid var(--line); overflow-y: auto;
    background: #131922;
  }
  nav a {
    display: block; padding: 9px 16px; color: var(--dim); text-decoration: none;
    border-left: 3px solid transparent;
  }
  nav a:hover { background: #1b232f; color: var(--text); }
  nav a.active { color: var(--accent); border-left-color: var(--accent); background: #1b232f; }
  nav .count { float: right; font-size: 12px; opacity: .65; }
  section { flex: 1; min-width: 0; overflow-y: auto; padding: 16px 22px 24px; }
  h2 {
    font-size: 15px; margin: 22px 0 10px; padding-bottom: 6px;
    border-bottom: 1px solid var(--line);
  }
  h2:first-child { margin-top: 0; }
  .event {
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    padding: 12px 14px; margin-bottom: 12px;
  }
  .event.picked { border-color: var(--ok); }
  .event h3 { margin: 0 0 4px; font-size: 14px; font-weight: 600; }
  .event h3 .id { color: var(--dim); font-size: 12px; font-weight: 400; margin-left: 8px; }
  .event .desc { color: var(--dim); font-size: 12.5px; margin: 4px 0 8px; }
  .rarity { font-size: 11px; padding: 1px 7px; border-radius: 10px; margin-left: 6px; }
  .rarity.普通 { background: #2b3340; color: #9aa7ba; }
  .rarity.稀有 { background: #1d3a5c; color: #6fb4ff; }
  .rarity.唯一 { background: #4a2d5e; color: #d59bff; }
  .pick {
    width: 100%; text-align: left; background: transparent; font: inherit; color: inherit;
    display: flex; gap: 10px; align-items: flex-start; padding: 7px 8px;
    border-radius: 6px; border: 1px solid transparent;
  }
  .pick:hover { background: #1d2531; }
  .pick.on { background: #14301f; border-color: #2c6b45; }
  .pick:disabled { cursor: default; color: #aab5c6; background: transparent; border-color: transparent; }
  .pick .body { flex: 1; min-width: 0; }
  .pick .txt { font-weight: 500; }
  .tag {
    display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 4px;
    margin-left: 6px; vertical-align: 1px;
  }
  .tag.dice { background: #4a3a10; color: #ffce56; }
  .tag.preferred { background: #244232; color: #a9efbf; }
  .tag.cond { background: #3d1f1f; color: #ff9c9c; }
  .tag.attack { background: #4a1f1f; color: #ff8f8f; }
  .eff, .pick .fu-desc { display: block; }
  .eff { color: #aab5c6; font-size: 12px; margin-top: 2px; }
  .eff .s { color: #7ede9d; }
  .eff .f { color: #ff9c9c; }
  footer {
    background: var(--panel); border-top: 1px solid var(--line); padding: 9px 22px;
  }
  footer .hint { color: #aab5c6; font-size: 12.5px; }
  footer .hint.err { color: #ff9c9c; font-weight: 600; }
  footer .hint.ok { color: #7ede9d; }
  .empty { color: var(--dim); padding: 30px 0; }
  /* 后续事件折叠块 */
  details.followup {
    margin: 4px 0 8px 18px; border-left: 2px solid #2f4a63; padding-left: 10px;
  }
  details.followup > summary {
    cursor: pointer; color: #7fc4ff; font-size: 12.5px; padding: 2px 0;
    list-style: none;
  }
  details.followup > summary::-webkit-details-marker { display: none; }
  details.followup > summary:hover { text-decoration: underline; }
  details.followup[open] > summary { margin-bottom: 4px; }
  .fu-event {
    background: #141b24; border: 1px solid #233042; border-radius: 6px;
    padding: 8px 10px; margin: 4px 0;
  }
  .fu-event .fu-title { font-size: 13px; font-weight: 600; }
  .fu-desc { color: var(--dim); font-size: 12px; margin: 3px 0 5px; overflow-wrap: anywhere; }
  .fu-event .pick { font-size: 12.5px; }
  .seq-bar {
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 4px 0 6px;
    padding: 5px 8px; border-radius: 5px; background: #1b2431;
    color: #8fa4bd; font-size: 12px;
  }
  .seq-clear {
    margin-left: auto; padding: 2px 8px; font-size: 11.5px;
    background: #2a1d1d; border-color: #4a2c2c; color: #e09a9a;
  }
  .seq-clear:hover { border-color: var(--bad); }
  .phase { margin: 6px 0 2px; font-size: 13px; font-weight: 600; color: #9dc8f5; }
  .phase.invalid { color: #ff9c9c; }
  @media (max-width: 680px) {
    main { flex-direction: column; }
    nav { width: 100%; flex: none; display: flex; overflow-x: auto; }
    nav a { white-space: nowrap; }
    nav .count { float: none; margin-left: 8px; }
    section { padding: 12px; }
  }
</style>
</head>
<body>
<header>
  <h1>卡厄思 · 事件偏好选择器</h1>
  <span id="stat" style="color:var(--dim);font-size:12.5px"></span>
  <span class="grow"></span>
  <input id="search" type="search" aria-label="搜索全部地图的事件" placeholder="搜索事件名、ID 或选项">
  <label><input type="checkbox" id="only-picked"> 只看已配置</label>
  <label><input type="checkbox" id="show-details"> 显示数据详情</label>
  <button id="btn-export" class="primary">导出选择</button>
  <button id="btn-import">导入</button>
  <button id="btn-clear">清空</button>
  <input id="file" type="file" accept=".json" style="display:none">
</header>
<main>
  <nav id="nav" aria-label="地图"></nav>
  <section id="list" aria-label="事件列表"></section>
</main>
<footer>
  <span class="hint" id="hint">
    已内置默认配置 <code>module/chaoszero/rogue_event_picks.json</code>；如需微调，可先「导入」它修改后再导出到
    <code>config/rogue/rogue_event_picks.json</code> 覆盖。
  </span>
  <div class="hint" id="status" role="status"></div>
</footer>
<script src="events.js"></script>
<script>
const STORE_KEY = 'czn_rogue_events_v1';
let DATA = null;
let PICKS = {};
let ACTIVE = null;
let MAP_GROUPS = [];
// 标签与列表按游戏地图分组，而不是按数据包名。这里和运行时
// module/chaoszero/rogue_events.py 的 PACK_WORLD / COMMON_PACKS 保持一致。
const MAP_WORLDS = [
  ['藍壺', ['uk_300_s02']],
  ['雙星之影', ['uk_302_s02']],
  ['霧之城市', ['uk_904_s01']],
  ['審判之沼', ['uk_905_s02']],
  ['降臨的混沌', ['uk_900_s02']],
  ['第0研究所', ['uk_400_s01', 'uk_e01_s01']],
  ['燃燒的生命', ['uk_401_s01']],
  ['虛像劇場', ['uk_402_s01']],
  ['萬花筒孵化場', ['uk_403_s01']],
  ['天上防護牆', ['uk_404_s01']],
];
const OTHER_MAPS = '其他';
const eventsById = new Map();
const rootIds = new Set();
const entryByChild = new Map();
// 已核对选项与效果一致的终止画面。第一项用于保存，原始入口仍全部展示。
const sharedPickGroups = [
  ['uk_300_s02_03b', 'uk_300_s02_03a-1', 'uk_300_s02_03c-1'],
  ['uk_sys_s02_01a', 'uk_sys_s02_01b', 'uk_sys_s02_01c', 'uk_sys_s02_01d'],
  ['uk_302_s02_07a-1', 'uk_302_s02_07a-3', 'uk_302_s02_07a-4'],
  ['uk_904_s01_07a-1', 'uk_904_s01_07b-1', 'uk_904_s01_07c-1'],
  ['uk_904_s01_07d-1', 'uk_904_s01_07e-2'],
];
const sharedPickById = new Map(sharedPickGroups.flatMap(group => group.map(id => [id, group])));
const sharedConflictHint = '同一页面有不同选项，请重选或清空后导出。';
const expanded = new Map();
const search = document.getElementById('search');
const onlyPicked = document.getElementById('only-picked');
const showDetails = document.getElementById('show-details');
const status = document.getElementById('status');

// 按原始事件的出现条件和回访效果逐步显示。固定路线的每一步须在所有回访结果下可用。
const shepherdStages = [[1, 4, 8], [2, 5, 8], [3, 6, 8], [7, 8]];
const assistStages = [[1, 4], [2, 4], [3, 4]];
const biddingStages = [[1, 5], [2, 5], [3, 5], [4, 5]];
const eventStages = {
  'uk_000_s01_01': [[1, 2, 3, 6], [4, 5, 6]],
  'uk_000_s01_02': [[1, 6, 7], [2, 8]],
  'uk_300_s02_04a-2': [[1, 4, 5], [2, 3]],
  'uk_300_s02_05a': [[1, 3, 5], [2, 3, 4]],
  'uk_300_s02_13a': [[1, 5], [2, 4], [3]],
  'uk_302_s02_03c': [[1, 2], [3, 4]],
  'uk_302_s02_04c': [[1, 3, 6], [2, 4, 6], [5, 6]],
  'uk_302_s02_06d': [[1, 2, 3], [1, 2, 4]],
  'uk_302_s02_16a': assistStages,
  'uk_302_s02_16b': assistStages,
  'uk_401_s01_04a': [[1, 4, 5], [2, 4, 5], [3, 4, 5]],
  'uk_401_s01_05b-1': [[1, 2, 3], [2, 3]],
  'uk_401_s01_17a': [[1, 3], [2, 4]],
  'uk_402_s01_11a-1': biddingStages,
  'uk_402_s01_11a-2': biddingStages,
  'uk_402_s01_11b-1': biddingStages,
  'uk_402_s01_11b-2': biddingStages,
  'uk_402_s01_11c-1': biddingStages,
  'uk_402_s01_11c-2': biddingStages,
  'uk_402_s01_12a': [[4, 5]],
  'uk_402_s01_15a': [[3, 4]],
  'uk_402_s01_16a': [[1, 4, 5], [2, 4, 5], [3, 4, 5]],
  'uk_403_s01_01b': [[1, 2], [3, 7], [7]],
  'uk_403_s01_04a': [[1, 3, 6], [2, 4, 7], [2, 5]],
  'uk_403_s01_05a-2': [[1, 3, 6], [2, 4, 7], [5, 8]],
  'uk_403_s01_05b': [[1, 2, 6], [1, 3, 6], [1, 4, 6], [5, 6]],
  'uk_403_s01_11a': [[1, 2, 5], [3, 5, 6], [4, 5, 6]],
  'uk_403_s01_11c': [[3, 4], [8]],
  'uk_403_s01_12a': [[1, 4, 5], [2, 4, 6], [3, 4, 6]],
  'uk_900_s02_05b': [[1, 4, 5], [2, 4, 5], [3, 4, 5]],
  'uk_900_s02_10c': [[1, 4], [2, 4], [3, 4]],
  'uk_900_s02_11a': [[1, 5, 6], [2, 5, 6], [3, 5, 6], [4, 6]],
  'uk_900_s02_16a': [[1, 3, 5], [2, 3, 5], [4, 5]],
  'uk_904_s01_04a': [[1, 2, 4], [1, 2, 4], [1, 3, 4]],
  'uk_904_s01_05a': [[1, 2, 8], [1, 3, 6], [1, 7]],
  'uk_904_s01_13a-1': shepherdStages,
  'uk_904_s01_13b-1': shepherdStages,
  'uk_905_s02_02a': [[1, 4, 8], [2, 5, 8], [3, 6, 8], [7, 8]],
  'uk_905_s02_04c': [[1, 2]],
  'uk_905_s02_06b-1': [[1, 3], [2]],
  'uk_905_s02_07a-1': [[1], [2, 3, 4]],
  'uk_905_s02_13a': [[1, 7], [2, 3, 7], [2, 4, 7], [2, 5, 7], [6, 7]],
  'uk_905_s02_13c': [[1, 4], [2, 3, 4]],
  'uk_905_s02_16a': [[1, 4, 5], [2, 4, 5], [3, 4, 5]],
  'uk_905_s02_16c': [[1, 2, 5], [1, 3, 5], [4, 5]],
};
const failureReturns = {
  'uk_302_s02_16a': [1, 2],
  'uk_302_s02_16b': [1, 2],
  'uk_401_s01_04a': [1, 2],
  'uk_401_s01_05b-1': [1],
  'uk_402_s01_11a-1': [1, 2, 3],
  'uk_402_s01_11a-2': [1, 2, 3],
  'uk_402_s01_11b-1': [1, 2, 3],
  'uk_402_s01_11b-2': [1, 2, 3],
  'uk_402_s01_11c-1': [1, 2, 3],
  'uk_402_s01_11c-2': [1, 2, 3],
  'uk_403_s01_01b': [2, 3],
  'uk_403_s01_11c': [1, 2],
  'uk_403_s01_12a': [1, 2],
  'uk_900_s02_10c': [1, 2],
  'uk_900_s02_11a': [5],
  'uk_904_s01_04a': [2],
  'uk_904_s01_09b': [1, 2, 3],
  'uk_905_s02_16a': [1, 2],
};
const eitherReturns = new Set(['uk_403_s01_01b', 'uk_403_s01_11c', 'uk_904_s01_09b']);
const repeatsLastStage = new Set(['uk_000_s01_02', 'uk_402_s01_12a', 'uk_905_s02_04c']);
const caveId = 'uk_904_s01_09b';

function save() {
  status.className = 'hint';
  status.textContent = '';
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify(PICKS));
  } catch (error) {
    status.textContent = '浏览器无法保存草稿，请先导出。';
  }
  updateStat();
}

function nextNode(option) {
  if (!option) return null;
  const embedded = option.nextDetail || (typeof option.next === 'object' ? option.next : null);
  if (embedded?.options?.length) return embedded;
  return eventsById.get(embedded?.id || option.next) || embedded;
}

function branchHas(node, predicate, seen) {
  if (predicate(node)) return true;
  // 自环 / 互跳的事件图里必须记住走过的节点，否则递归到栈溢出，
  // 整个列表渲染失败只剩一句"没有符合条件的事件"。
  const visited = seen || new Set();
  visited.add(node.id);
  return (node.options || []).some(option => {
    const next = nextNode(option);
    return next && !visited.has(next.id) && branchHas(next, predicate, visited);
  });
}

function matches(node, query) {
  return [node.name, node.id, ...(node.options || []).map(option => option.text)]
    .some(text => (text || '').toLowerCase().includes(query));
}

function hasPick(node) {
  return branchHas(node, branch => (sharedPickById.get(branch.id) || [branch.id])
    .some(id => Object.hasOwn(PICKS, id)));
}

function updateStat() {
  const keys = new Set(Object.keys(PICKS).map(id => sharedPickById.get(id)?.[0] || id));
  document.getElementById('stat').textContent = '已选 ' + keys.size + ' 个事件';
}

/* 地图分组：只影响展示，包 id / 事件 id 仍是原来的。 */
function mapGroups() {
  const assigned = new Set(MAP_WORLDS.flatMap(([, ids]) => ids));
  const groups = MAP_WORLDS.map(([name, ids]) => [name, DATA.packs.filter(pack => ids.includes(pack.id))]);
  groups.push([OTHER_MAPS, DATA.packs.filter(pack => !assigned.has(pack.id))]);
  return groups.map(([name, packs]) => ({
    name,
    entries: packs.flatMap(pack => pack.events.map(event => ({event, path: pack.id + '/' + event.id}))),
  })).filter(group => group.entries.length);
}

function renderNav() {
  const nav = document.getElementById('nav');
  const scroll = nav.scrollTop;
  const horizontal = nav.scrollLeft;
  const focus = nav.contains(document.activeElement) ? document.activeElement.dataset.map : '';
  nav.replaceChildren();
  for (const group of MAP_GROUPS) {
    const a = document.createElement('a');
    a.href = '#';
    a.dataset.map = group.name;
    a.className = (ACTIVE === group.name ? 'active' : '');
    a.textContent = group.name;
    const count = document.createElement('span');
    count.className = 'count';
    count.textContent = group.entries.filter(({event}) => hasPick(event)).length + '/' + group.entries.length;
    a.appendChild(count);
    a.onclick = ev => {
      ev.preventDefault();
      ACTIVE = group.name;
      search.value = '';
      renderNav();
      renderList(true);
    };
    nav.appendChild(a);
    if (focus === group.name) a.focus({preventScroll: true});
  }
  nav.scrollTop = scroll;
  nav.scrollLeft = horizontal;
}

function returnOutcome(node, option) {
  if (!option || !canPick(option)) return '';
  if (failureReturns[node.id]?.includes(option.order)) {
    return eitherReturns.has(node.id) ? 'either' : 'fail';
  }
  return option.next === node.id || nextNode(option)?.id === node.id ? 'success' : '';
}

function isLoopEvent(node) {
  return (node.options || []).some(option => returnOutcome(node, option));
}

function guidedEvent(node) {
  return Boolean(eventStages[node.id]) || node.id === caveId;
}

function visibleOrders(node, sequence, visit) {
  if (node.id === caveId) {
    const choices = [1, 2, 3].filter(order => !sequence.slice(0, visit).includes(order));
    if (visit) choices.push(4);
    return choices;
  }
  const stages = eventStages[node.id];
  return stages[visit] || (repeatsLastStage.has(node.id) ? stages[stages.length - 1] : []);
}

function stageOptions(node, sequence) {
  for (const [visit, order] of sequence.entries()) {
    if (!visibleOrders(node, sequence, visit).includes(order)) return null;
    const option = node.options.find(item => item.order === order);
    if (!returnOutcome(node, option)) return visit + 1 === sequence.length ? [] : null;
  }
  const orders = visibleOrders(node, sequence, sequence.length);
  return orders.length ? node.options.filter(option => canPick(option) && orders.includes(option.order)) : null;
}

function classification(node, option) {
  const box = document.createElement(option ? 'span' : 'div');
  box.className = 'fu-desc';
  if (!option) {
    if (node.option_count === undefined) return box;
    box.textContent = `页面选项数 ${node.option_count ?? '未注明'}，上限 ${node.option_count_max ?? '未注明'}；`
      + `库内共 ${node.options.length} 条分支（含攻击）。条件或随机分支不保证同时出现。`;
    return box;
  }
  const types = {DEFAULT: '常规', RANDOM: '随机/条件出现', RANDOM_1: '随机分支 RANDOM_1', ATTACK: '攻击（独立按钮）'};
  const labels = [types[option.select_type] || option.select_type];
  if (option.appear_conditions?.length) labels.push('出现条件：' + option.appear_conditions.join('；'));
  if (option.exclusive_with?.length) {
    const orders = node.options.filter(o => option.exclusive_with.includes(o.id)).map(o => o.order);
    labels.push('与选项 ' + orders.join('、') + ' 互斥显示');
  }
  if (option.select_conditions?.length) labels.push('选择限制：' + option.select_conditions.join('；'));
  if (option.conditions?.length) labels.push('选择条件：' + option.conditions.join('；'));
  if (option.condition_ids?.length) labels.push('选择条件 ID：' + option.condition_ids.join('；'));
  box.textContent = labels.filter(Boolean).join(' ｜ ');
  return box;
}

function canPick(option) {
  return option.order !== 9999 && option.select_type !== 'ATTACK' && option.option_type !== 'ATTACK'
    && Boolean(optionTitle(option));
}

function optionTitle(option) {
  // Keep this in step with the runtime OCR normalization.
  return (option.text || '').replace(/[^\u4e00-\u9fff]/g, '');
}

function variableOption(option) {
  return option.select_type?.startsWith('RANDOM') || Boolean(option.appear_conditions?.length);
}

function priorityEvent(node) {
  if (guidedEvent(node)) return false;
  const options = (node.options || []).filter(canPick);
  return isLoopEvent(node) || options.some(variableOption)
    || new Set(options.map(optionTitle)).size < options.length;
}

function priorityGroups(node) {
  const titles = new Map();
  for (const option of node.options) {
    const title = optionTitle(option);
    if (!titles.has(title)) titles.set(title, []);
    titles.get(title).push(option);
  }
  const groups = new Map();
  for (const [title, options] of titles) {
    if (!options.every(canPick)) continue;
    if (options.length > 1) {
      groups.set(title, options);
    } else {
      const {order} = options[0];
      if (Number.isInteger(order) && order > 0 && order < 9999
          && node.options.filter(option => option.order === order).length === 1) {
        groups.set(order, options);
      }
    }
  }
  return groups;
}

function validationError(message, eventId) {
  const err = new Error(message);
  if (eventId) err.eventId = eventId;
  return err;
}

function sharedPickState(picks, group) {
  const values = group.filter(id => Object.hasOwn(picks, id)).map(id => picks[id]);
  const comparable = values.map(value => Array.isArray(value) && value.length === 1 ? value[0] : value);
  const conflict = new Set(comparable.map(value => JSON.stringify(value))).size > 1;
  return {value: conflict ? undefined : comparable[0], conflict};
}

function validatePicks(parsed, complete = false) {
  if (!parsed || typeof parsed !== 'object' || Array.isArray(parsed)) {
    throw new Error('需要一个事件配置对象。');
  }
  const wrapped = Object.hasOwn(parsed, 'picks');
  if (wrapped && parsed.version !== undefined && parsed.version !== 1) {
    throw new Error('无法读取此版本的事件配置。');
  }
  const picks = wrapped ? parsed.picks : parsed;
  if (!picks || typeof picks !== 'object' || Array.isArray(picks)) {
    throw new Error('picks 必须是事件 ID 到选项编号的对象。');
  }
  for (const [id, value] of Object.entries(picks)) {
    const node = eventsById.get(id);
    if (!node) throw validationError('未找到事件 ' + id + '。', id);
    if (value && Object.hasOwn(value, 'priority')) {
      const {priority} = value;
      const groups = priorityEvent(node) ? priorityGroups(node) : new Map();
      if (Object.keys(value).length !== 1 || !Array.isArray(priority)
          || !priority.length || new Set(priority).size !== priority.length
          || !priority.every(key => groups.has(key))) {
        throw validationError('「' + node.name + '」包含重复或无法识别的优先选项。同名分支请按标题配置。', id);
      }
      continue;
    }
    const orders = new Set(node.options.filter(canPick).map(option => option.order));
    const sequence = Array.isArray(value) ? value : [value];
    if (!sequence.length || sequence.some(order => !Number.isInteger(order) || !orders.has(order))) {
      throw validationError(node.name + '（' + id + '）包含不可配置的选项编号。', id);
    }
    if (guidedEvent(node)) {
      const options = stageOptions(node, sequence);
      if (!options) throw validationError(node.name + '的路线顺序无效，请重新选择。', id);
      if (complete && options.length) throw validationError('请完成「' + node.name + '」的后续选择。', id);
    } else if (sequence.length > 1 && !isLoopEvent(node)) {
      throw validationError(node.name + '的选项只需配置一次。', id);
    } else if (complete && priorityEvent(node)) {
      const groups = priorityGroups(node);
      if (sequence.some(order => !groups.has(order))) {
        throw validationError('「' + node.name + '」包含同名或无法区分的选项编号，请按标题重选后导出。', id);
      }
      if (isLoopEvent(node) || sequence.some(order => groups.get(order).some(variableOption))) {
        throw validationError('「' + node.name + '」需改用优先顺序点击选项后导出，请清除或重选此事件。', id);
      }
    }
  }
  let result = picks;
  for (const group of sharedPickGroups) {
    const [canonical, ...aliases] = group;
    const {value, conflict} = sharedPickState(picks, group);
    if (conflict && complete) {
      const node = eventsById.get(canonical);
      throw validationError('「' + node.name + '」的同一页面保存了不同选项，请重选一个或清空共同选择。', canonical);
    }
    if (conflict || value === undefined) continue;
    if (picks[canonical] !== value || aliases.some(id => Object.hasOwn(picks, id))) {
      if (result === picks) result = {...picks};
      for (const id of aliases) delete result[id];
      result[canonical] = value;
    }
  }
  return result;
}

function pickSequence(stored) {
  if (Array.isArray(stored)) return stored;
  return stored === undefined ? [] : [stored];
}

function loopBar(node, sequence, path) {
  const bar = document.createElement('div');
  bar.className = 'seq-bar';
  const label = document.createElement('span');
  const route = sequence.map((order, index) => {
    const option = node.options.find(item => item.order === order);
    return (index + 1) + '. ' + (option?.text || '#' + order);
  }).join(' → ');
  label.textContent = route;
  bar.appendChild(label);
  if (sequence.length) {
    const undo = document.createElement('button');
    undo.id = path + '/undo';
    undo.textContent = '撤销最后一步';
    undo.className = 'seq-clear';
    undo.onclick = () => setPick(node, sequence.slice(0, -1));
    bar.appendChild(undo);
    const clear = document.createElement('button');
    clear.id = path + '/clear';
    clear.textContent = '清空顺序';
    clear.onclick = () => setPick(node, []);
    bar.appendChild(clear);
  }
  return bar;
}

function entryKey(node, option) {
  if (!canPick(option)) return null;
  if (!priorityEvent(node)) return option.order;
  const groups = priorityGroups(node);
  for (const key of [option.order, optionTitle(option)]) {
    if (groups.get(key)?.includes(option)) return key;
  }
  return null;
}

function entryValue(node, key, current) {
  if (guidedEvent(node)) {
    const sequence = pickSequence(current);
    const options = stageOptions(node, sequence);
    if (options?.length === 0 && sequence.at(-1) === key) return current;
    if (options?.some(option => option.order === key)) return [...sequence, key];
    return undefined;
  }
  if (priorityEvent(node)) {
    const groups = priorityGroups(node);
    const sequence = Array.isArray(current?.priority) ? current.priority : pickSequence(current);
    return {priority: [key, ...sequence.filter(item => item !== key && groups.has(item))]};
  }
  return key;
}

function indexEntries() {
  for (const node of eventsById.values()) {
    for (const option of node.options) {
      const key = entryKey(node, option);
      const targets = new Set([nextNode(option)?.id,
        option.raw?.success_link_encounter_option_eff?.next_encounter_id,
        option.raw?.fail_link_encounter_option_eff?.next_encounter_id]);
      for (const child of targets) {
        if (child === node.id || !eventsById.has(child)) continue;
        if (!entryByChild.has(child)) entryByChild.set(child, new Map());
        entryByChild.get(child).set(JSON.stringify([node.id, key]), {node, key});
      }
    }
  }
}

function fillMissingEntries(picks) {
  const paths = [];
  const requested = new Map();
  for (const id of Object.keys(picks)) {
    const path = new Map();
    const seen = new Set([id]);
    let child = id;
    while (!rootIds.has(child) && !sharedPickById.has(child)) {
      const entries = entryByChild.get(child);
      if (entries?.size !== 1) break;
      const {node, key} = entries.values().next().value;
      if (key === null || seen.has(node.id) || Object.hasOwn(picks, node.id)) break;
      const value = entryValue(node, key);
      if (value === undefined) break;
      path.set(node.id, value);
      if (!requested.has(node.id)) requested.set(node.id, new Set());
      requested.get(node.id).add(JSON.stringify(value));
      seen.add(node.id);
      child = node.id;
    }
    if (path.size) paths.push(path);
  }
  const inferred = new Map();
  for (const path of paths) {
    if ([...path.keys()].every(id => requested.get(id).size === 1)) {
      for (const [id, value] of path) inferred.set(id, value);
    }
  }
  return inferred.size ? {...picks, ...Object.fromEntries(inferred)} : picks;
}

function setPick(node, value, parentPath = []) {
  let blocked = false;
  if (value !== undefined && (!Array.isArray(value) || value.length)) {
    const additions = {};
    for (const {node: parent, option} of parentPath) {
      const key = entryKey(parent, option);
      const next = key === null ? undefined : entryValue(parent, key, additions[parent.id] ?? PICKS[parent.id]);
      if (next === undefined) {
        blocked = true;
        break;
      }
      additions[parent.id] = next;
    }
    if (!blocked) Object.assign(PICKS, additions);
  }
  const [id, ...aliases] = sharedPickById.get(node.id) || [node.id];
  for (const alias of aliases) delete PICKS[alias];
  if (value === undefined || (Array.isArray(value) && !value.length)) delete PICKS[id];
  else PICKS[id] = value;
  save();
  if (blocked) status.textContent = '已保存后续选择。此入口需要手动触发或先完成前置步骤。';
  renderNav();
  renderList();
}

function togglePriority(node, sequence, groups, key, parentPath) {
  const keys = sequence.filter(item => groups.has(item));
  const priority = keys.includes(key) ? keys.filter(item => item !== key) : [...keys, key];
  setPick(node, priority.length ? {priority} : undefined, priority.includes(key) ? parentPath : []);
}

function renderOption(node, option, sequence, loop, path, depth, query, reference = false, groups = null, parentPath = []) {
  const group = document.createElement('div');
  const button = document.createElement('button');
  button.id = path;
  const rank = sequence.indexOf(option.order);
  const picked = !reference && (groups ? rank !== -1 : sequence[sequence.length - 1] === option.order);
  button.className = 'pick' + (picked ? ' on' : '');
  button.disabled = reference || !canPick(option) || Boolean(groups && !groups.has(option.order));
  if (!loop || groups) button.setAttribute('aria-pressed', String(picked));
  if (!button.disabled) {
    button.onclick = groups ? () => togglePriority(node, sequence, groups, option.order, parentPath)
      : () => setPick(node, loop ? sequence.concat(option.order) : picked ? undefined : option.order, parentPath);
  }

  const body = document.createElement('span');
  body.className = 'body';
  const title = document.createElement('span');
  title.className = 'txt';
  const guided = guidedEvent(node) && !reference;
  title.textContent = (guided && !showDetails.checked ? '' : option.order + '. ') + (option.text || '（空）');
  body.appendChild(title);
  for (const [kind, text] of [
    ['preferred', groups && picked && (rank === 0 ? '首选' : '备选 ' + rank)],
    ['dice', option.dice && '骰 ' + option.dice],
    ['cond', option.condition],
    ['attack', option.attack && '战斗'],
    ['cond', button.disabled && '仅展示'],
  ]) {
    if (!text) continue;
    const tag = document.createElement('span');
    tag.className = 'tag ' + kind;
    tag.textContent = text;
    body.appendChild(tag);
  }
  const outcome = returnOutcome(node, option);
  const effects = (text, kind) => {
    const values = text?.split(' / ').map(effect => effect.trim())
      .filter(effect => effect && (showDetails.checked || !effect.startsWith('{id}'))) || [];
    if (outcome === kind || outcome === 'either') values.push('继续本事件');
    return values.join(' · ');
  };
  const success = effects(option.success, 'success');
  const fail = effects(option.fail, 'fail');
  for (const [kind, label, text] of [['s', option.dice ? '成功' : '', success], ['f', '失败', fail]]) {
    if (!text) continue;
    const effect = document.createElement('span');
    effect.className = 'eff';
    const badge = document.createElement('span');
    badge.className = kind;
    badge.textContent = label && label + ' ';
    effect.append(badge, text.replace(/<\/?(?:cc|color_chaos)\b[^>]*>|<#[0-9a-f]{6}>/gi, ''));
    body.appendChild(effect);
  }
  if (showDetails.checked) {
    body.appendChild(classification(node, option));
  } else {
    const notes = (option.conditions || []).filter(condition => condition !== option.condition);
    if (!guided && option.appear_conditions?.length) notes.push('满足条件时出现');
    else if (!guided && option.select_type?.startsWith('RANDOM')) notes.push('可能随机出现');
    if (notes.length) {
      const note = document.createElement('span');
      note.className = 'fu-desc';
      note.textContent = notes.join(' · ');
      body.appendChild(note);
    }
  }
  button.appendChild(body);
  group.appendChild(button);

  const followup = renderFollowup(node, option, path, depth, query, parentPath);
  if (followup) group.appendChild(followup);
  return group;
}

function renderTitleGroup(node, variants, sequence, groups, path, depth, query, parentPath) {
  const title = optionTitle(variants[0]);
  const rank = sequence.indexOf(title);
  const button = document.createElement('button');
  button.id = path + '/title/' + title;
  button.className = 'pick' + (rank < 0 ? '' : ' on');
  button.setAttribute('aria-pressed', String(rank >= 0));
  button.textContent = (rank === 0 ? '首选 · ' : rank > 0 ? '备选 ' + rank + ' · ' : '')
    + variants[0].text + '（接受任一同名分支）';
  button.onclick = () => togglePriority(node, sequence, groups, title, parentPath);
  const details = document.createElement('details');
  details.className = 'followup';
  details.dataset.branch = button.id;
  details.open = expanded.get(button.id) ?? Boolean(query && variants.some(option => {
    const next = nextNode(option);
    return next && branchHas(next, item => matches(item, query));
  }));
  const summary = document.createElement('summary');
  summary.textContent = '查看各分支条件和结果';
  details.appendChild(summary);
  for (const option of variants) {
    details.appendChild(renderOption(node, option, [], false, path + '/' + (option.id || option.order),
      depth, query, true, null, parentPath));
  }
  const group = document.createElement('div');
  group.append(button, details);
  return group;
}

function renderFollowup(node, option, path, depth, query, parentPath) {
  const next = nextNode(option);
  if (!next || next.id === node.id || depth >= 3) return null;
  const details = document.createElement('details');
  details.className = 'followup';
  details.dataset.branch = path;
  const hasChoices = Boolean(next.options?.length);
  details.open = expanded.get(path) ?? Boolean(query && branchHas(next, item => matches(item, query))
    || (depth === 0 && hasChoices));
  const summary = document.createElement('summary');
  let caption = '后续';
  if (sharedPickById.has(next.id)) {
    const success = option.raw?.success_link_encounter_option_eff;
    const failure = option.raw?.fail_link_encounter_option_eff;
    const onSuccess = success?.next_encounter_id === next.id;
    const onFailure = failure?.next_encounter_id === next.id;
    const diceResult = option.dice && onSuccess !== onFailure ? (onSuccess ? '掷骰成功' : '掷骰失败') : '';
    const battle = (onSuccess || onFailure) && (!onSuccess || success.battle_id) && (!onFailure || failure.battle_id);
    if (diceResult || battle) caption = [diceResult, battle && '战斗胜利'].filter(Boolean).join('、') + '后';
  }
  summary.textContent = caption + '：' + (next.name || next.id) + '（' + next.id + '）';
  const visit = expanded.get('@' + path) || 0;
  expanded.set('@' + path, visit + 1);
  details.append(summary, renderEvent(next, path + (visit ? '~' + visit : ''), depth + 1, query, [...parentPath, {node, option}]));
  return details;
}

function renderEvent(node, path, depth, query, parentPath = []) {
  const box = document.createElement('div');
  box.className = depth ? 'fu-event' : 'event' + (hasPick(node) ? ' picked' : '');
  const title = document.createElement(depth ? 'div' : 'h3');
  title.className = depth ? 'fu-title' : '';
  title.textContent = node.name || node.id;
  if (node.rarity) {
    const badge = document.createElement('span');
    badge.className = 'rarity ' + node.rarity;
    badge.textContent = node.rarity;
    title.appendChild(badge);
  }
  if (!depth) {
    const id = document.createElement('span');
    id.className = 'id';
    id.textContent = node.id;
    title.appendChild(id);
  }
  box.appendChild(title);
  if (showDetails.checked) box.appendChild(classification(node));
  if (node.desc || !node.options?.length) {
    const desc = document.createElement('div');
    desc.className = depth ? 'fu-desc' : 'desc';
    desc.textContent = node.desc || '本层无可配置的选项。';
    box.appendChild(desc);
  }

  const loop = isLoopEvent(node);
  const guided = guidedEvent(node);
  const priority = priorityEvent(node);
  const stagedLoop = loop && !priority;
  const groups = priority ? priorityGroups(node) : null;
  const sharedGroup = sharedPickById.get(node.id);
  const {value, conflict} = sharedGroup ? sharedPickState(PICKS, sharedGroup) : {value: PICKS[node.id]};
  const stored = value?.priority;
  const sequence = priority && Array.isArray(stored) ? stored : pickSequence(value);
  const options = guided ? stageOptions(node, sequence) : stagedLoop ? [] : node.options || [];
  if (sharedGroup) {
    const note = document.createElement('p');
    note.className = conflict ? 'phase invalid' : 'phase';
    note.textContent = conflict ? '旧配置为这个页面选了不同选项。请重选，或清空共同选择。'
      : (depth ? '进入此页面后才执行。' : '') + '此页面可从不同入口遇到，选择会同步到其他入口。';
    box.appendChild(note);
    if (conflict) {
      const clear = document.createElement('button');
      clear.id = path + '/shared-clear';
      clear.className = 'seq-clear';
      clear.textContent = '清空共同选择';
      clear.onclick = () => setPick(node, undefined);
      box.appendChild(clear);
    }
  }
  if (priority) {
    const note = document.createElement('p');
    note.className = 'phase';
    note.textContent = '先点首选，再按偏好点备选。再点已选项可取消。脚本会按此顺序核对当前画面。';
    box.appendChild(note);
    const missingPriority = sequence.some(key => !groups.has(key));
    const requiresPriority = loop || sequence.some(key => groups.get(key)?.some(variableOption));
    if (sequence.length && !Array.isArray(stored) && (missingPriority || requiresPriority)) {
      const hint = document.createElement('p');
      hint.className = 'fu-desc';
      hint.textContent = missingPriority
        ? '旧规则指定了同名选项的编号。请选择该标题，确认接受任一同名分支。'
        : '旧规则保存了固定编号。请更新为优先顺序后导出。';
      box.appendChild(hint);
    }
    if (!missingPriority && sequence.length && !sequence.some(key => groups.get(key)?.some(option =>
      option.select_type === 'DEFAULT' && !variableOption(option)
        && !option.select_conditions?.length && !option.condition_ids?.length && !option.conditions?.length))) {
      const hint = document.createElement('p');
      hint.className = 'fu-desc';
      hint.textContent = '已选项可能都不出现或不可选。可添加常规选项作为备选。';
      box.appendChild(hint);
    }
    if (value !== undefined) {
      const clear = document.createElement('button');
      clear.id = path + '/clear';
      clear.className = 'seq-clear';
      clear.textContent = '清空优先顺序';
      clear.onclick = () => setPick(node, undefined);
      box.appendChild(clear);
    }
  }
  if ((stagedLoop || guided) && sequence.length) box.appendChild(loopBar(node, sequence, path));
  if (guided || stagedLoop) {
    const phase = document.createElement('p');
    phase.id = path + '/phase';
    phase.className = options ? 'phase' : 'phase invalid';
    phase.tabIndex = -1;
    const previous = node.options.find(option => option.order === sequence[sequence.length - 1]);
    if (!guided) {
      phase.textContent = '选项随游戏状态变化，暂无法配置固定路线。';
    } else if (options === null) {
      phase.textContent = '当前路线无法到达。请撤销最后一步或清空后重选。';
    } else if (!options.length) {
      phase.textContent = '路线已配置'
        + (!previous?.dice && previous?.success ? ' · ' + previous.success.replace(/<[^>]+>/g, '') : '');
    } else if (!previous) {
      phase.textContent = '第 1 步 · 首次遇到';
    } else {
      const result = returnOutcome(node, previous);
      const label = previous.dice && result !== 'either' ? (result === 'fail' ? '失败' : '成功') : '';
      phase.textContent = '第 ' + (sequence.length + 1) + ' 步 · 「' + previous.text + '」' + label + '后';
    }
    box.appendChild(phase);
    if (guided && options?.length === 0 && previous) {
      const optionPath = path + '/' + (previous.id || previous.order);
      const followup = renderFollowup(node, previous, optionPath, depth, query, parentPath);
      if (followup) box.appendChild(followup);
    }
  }
  for (const option of options || []) {
    const variants = groups?.get(optionTitle(option));
    if (variants) {
      if (variants[0] === option) box.appendChild(renderTitleGroup(node, variants, sequence, groups, path, depth, query, parentPath));
      continue;
    }
    const optionPath = path + '/' + (option.id || option.order);
    box.appendChild(renderOption(node, option, sequence, loop || guided, optionPath, depth, query, false, groups, parentPath));
  }

  if (stagedLoop || guided) {
    const known = node.id === caveId ? [1, 2, 3, 4] : eventStages[node.id]?.flat() || [];
    const unverified = node.options.filter(option => canPick(option) && !known.includes(option.order));
    if (unverified.length) {
      const reference = document.createElement('details');
      const summary = document.createElement('summary');
      summary.textContent = '查看随游戏状态变化的选项';
      const note = document.createElement('p');
      note.className = 'fu-desc';
      note.textContent = '这些选项是否出现取决于游戏状态，供查看。';
      reference.append(summary, note);
      for (const option of unverified) {
        const optionPath = path + '/' + (option.id || option.order);
        reference.appendChild(renderOption(node, option, sequence, loop, optionPath, depth, query, true, null, parentPath));
      }
      box.appendChild(reference);
    }
  }
  return box;
}

function renderList(resetScroll = false) {
  expanded.clear();
  const list = document.getElementById('list');
  const query = search.value.trim().toLowerCase();
  const focus = list.contains(document.activeElement) ? document.activeElement.id : '';
  const scroll = list.scrollTop;
  for (const details of list.querySelectorAll('details[data-branch]')) {
    expanded.set(details.dataset.branch, details.open);
  }
  list.replaceChildren();
  for (const group of MAP_GROUPS) {
    if (!query && group.name !== ACTIVE) continue;
    const shown = group.entries.filter(({event}) =>
      (!onlyPicked.checked || hasPick(event)) && (!query || branchHas(event, node => matches(node, query))));
    if (!shown.length) continue;
    const heading = document.createElement('h2');
    heading.textContent = group.name + '　' + shown.length + ' / ' + group.entries.length;
    list.appendChild(heading);
    for (const {event, path} of shown) {
      try {
        list.appendChild(renderEvent(event, path, 0, query));
      } catch (error) {
        const failed = document.createElement('p');
        failed.className = 'empty';
        failed.textContent = '「' + (event.name || event.id) + '」渲染失败：' + error.message;
        list.appendChild(failed);
      }
    }
  }
  if (!list.firstChild) {
    const empty = document.createElement('p');
    empty.className = 'empty';
    empty.textContent = '没有符合条件的事件。';
    list.appendChild(empty);
  }
  if (focus) {
    const nextFocus = document.getElementById(focus)
      || document.getElementById(focus.slice(0, focus.lastIndexOf('/')) + '/phase');
    nextFocus?.focus({preventScroll: true});
  }
  list.scrollTop = resetScroll ? 0 : scroll;
}

function exportPicks() {
  let picks;
  try {
    picks = validatePicks(PICKS, true);
  } catch (error) {
    status.className = 'hint err';
    status.textContent = '无法导出：' + error.message;
    if (error.eventId && search) {
      onlyPicked.checked = false;
      search.value = error.eventId;
      renderList(true);
    }
    if (typeof alert === 'function') alert('无法导出：' + error.message);
    return;
  }
  const payload = {
    generated: new Date().toISOString(),
    version: 1,
    picks
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'rogue_event_picks.json';
  if (a.style) a.style.display = 'none';
  document.body?.appendChild?.(a);
  a.click();
  a.remove?.();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  status.className = 'hint ok';
  status.textContent = '已导出 ' + Object.keys(picks).length + ' 条选择。';
}

function importPicks(file) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const next = fillMissingEntries(validatePicks(JSON.parse(reader.result)));
      if (Object.keys(PICKS).length && !confirm('用导入文件替换当前草稿？')) return;
      PICKS = next;
      save(); renderNav(); renderList();
      if (!status.textContent) {
        const conflict = sharedPickGroups.some(group => sharedPickState(PICKS, group).conflict);
        status.textContent = conflict ? '已导入。' + sharedConflictHint
          : '已导入 ' + Object.keys(PICKS).length + ' 条选择。';
      }
    } catch (error) {
      status.textContent = '导入失败，当前草稿保留。' + error.message;
    }
  };
  reader.onerror = () => { status.textContent = '读不到文件，当前草稿保留。'; };
  reader.readAsText(file);
}

const doc = window.EVENTS_DATA;
if (!doc) {
  document.getElementById('list').innerHTML =
    '<div class="empty">没读到 events.js。请确认它和 index.html 在同一个目录。</div>';
  document.querySelectorAll('header button, header input').forEach(control => { control.disabled = true; });
} else {
  DATA = doc;
  function indexEvent(node, path = '') {
    // 先登记再展开：同一子事件会经多条分支被看到，只有第一次（pack/事件 id 路径）算它的家。
    // ❗不能用 `if (!eventsById.has())` 跳过整棵子树 —— 自环（`next` 指回自己）会在这里无限递归。
    if (node.options?.length && !eventsById.has(node.id)) {
      eventsById.set(node.id, node);
      node.path = path;
    }
    for (const option of node.options || []) {
      const next = option.nextDetail || (typeof option.next === 'object' ? option.next : null);
      if (next) indexEvent(next, path + '/' + (option.id || option.order));
    }
  }
  for (const pack of DATA.packs) {
    pack.events.forEach(event => {
      rootIds.add(event.id);
      indexEvent(event, pack.id + '/' + event.id);
    });
  }
  indexEntries();
  MAP_GROUPS = mapGroups();
  ACTIVE = MAP_GROUPS[0]?.name;
  try {
    const draft = JSON.parse(localStorage.getItem(STORE_KEY) || '{}');
    if (!draft || typeof draft !== 'object' || Array.isArray(draft)) throw new Error('草稿格式错误');
    PICKS = draft;
    PICKS = fillMissingEntries(validatePicks(draft));
    if (PICKS !== draft) save();
  } catch (error) {
    status.textContent = '浏览器草稿需要检查。' + error.message;
  }
  if (!status.textContent && sharedPickGroups.some(group => sharedPickState(PICKS, group).conflict)) {
    status.textContent = '检查草稿。' + sharedConflictHint;
  }
  renderNav(); renderList(); updateStat();
}

search.oninput = () => renderList(true);
onlyPicked.onchange = () => renderList(true);
showDetails.onchange = () => renderList();
document.getElementById('btn-export').onclick = exportPicks;
document.getElementById('btn-clear').onclick = () => {
  if (confirm('清空所有已选事件？')) { PICKS = {}; save(); renderNav(); renderList(); }
};
document.getElementById('btn-import').onclick = () => document.getElementById('file').click();
document.getElementById('file').onchange = ev => {
  const file = ev.target.files[0];
  ev.target.value = '';
  if (file) importPicks(file);
};
</script>
</body>
</html>
