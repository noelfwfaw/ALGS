<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>卡厄思 · 事件偏好选择器</title>
<style>
  :root {
    --bg: #10141b; --panel: #171d27; --line: #232c3a; --text: #d7dee9;
    --dim: #7b879b; --accent: #4da3ff; --ok: #38c172; --warn: #e3a008; --bad: #e3342f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font: 14px/1.6 "Segoe UI", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text);
  }
  header {
    position: sticky; top: 0; z-index: 10; background: var(--panel);
    border-bottom: 1px solid var(--line); padding: 10px 18px;
    display: flex; gap: 14px; align-items: center; flex-wrap: wrap;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header .grow { flex: 1; }
  button {
    background: #222c3b; color: var(--text); border: 1px solid var(--line);
    border-radius: 6px; padding: 6px 12px; cursor: pointer; font-size: 13px;
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: #08111d; border-color: var(--accent); font-weight: 600; }
  main { display: flex; height: calc(100vh - 53px); }
  nav {
    width: 210px; border-right: 1px solid var(--line); overflow-y: auto;
    background: #131922;
  }
  nav a {
    display: block; padding: 9px 16px; color: var(--dim); text-decoration: none;
    border-left: 3px solid transparent;
  }
  nav a:hover { background: #1b232f; color: var(--text); }
  nav a.active { color: var(--accent); border-left-color: var(--accent); background: #1b232f; }
  nav .count { float: right; font-size: 12px; opacity: .65; }
  section { flex: 1; overflow-y: auto; padding: 16px 22px 80px; }
  h2 {
    font-size: 15px; margin: 22px 0 10px; padding-bottom: 6px;
    border-bottom: 1px solid var(--line);
  }
  h2:first-child { margin-top: 0; }
  .event {
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    padding: 12px 14px; margin-bottom: 12px;
  }
  .event.picked { border-color: var(--ok); }
  .event h3 { margin: 0 0 4px; font-size: 14px; font-weight: 600; }
  .event h3 .id { color: var(--dim); font-size: 12px; font-weight: 400; margin-left: 8px; }
  .event .desc { color: var(--dim); font-size: 12.5px; margin: 4px 0 8px; }
  .rarity { font-size: 11px; padding: 1px 7px; border-radius: 10px; margin-left: 6px; }
  .rarity.普通 { background: #2b3340; color: #9aa7ba; }
  .rarity.稀有 { background: #1d3a5c; color: #6fb4ff; }
  .rarity.唯一 { background: #4a2d5e; color: #d59bff; }
  .opt {
    display: flex; gap: 10px; align-items: flex-start; padding: 7px 8px;
    border-radius: 6px; cursor: pointer; border: 1px solid transparent;
  }
  .opt:hover { background: #1d2531; }
  .opt.on { background: #14301f; border-color: #2c6b45; }
  .opt input { margin-top: 4px; }
  .opt .body { flex: 1; }
  .opt .txt { font-weight: 500; }
  .tag {
    display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 4px;
    margin-left: 6px; vertical-align: 1px;
  }
  .tag.dice { background: #4a3a10; color: #ffce56; }
  .tag.cond { background: #3d1f1f; color: #ff9c9c; }
  .tag.attack { background: #4a1f1f; color: #ff8f8f; }
  .tag.next { background: #24313f; color: #7fc4ff; }
  .eff { color: var(--dim); font-size: 12px; margin-top: 2px; }
  .eff .s { color: #7ede9d; }
  .eff .f { color: #ff9c9c; }
  footer {
    position: fixed; left: 210px; right: 0; bottom: 0; background: var(--panel);
    border-top: 1px solid var(--line); padding: 9px 22px; display: flex;
    gap: 12px; align-items: center;
  }
  footer .hint { color: var(--dim); font-size: 12.5px; flex: 1; }
  .empty { color: var(--dim); padding: 30px 0; }
  /* 后续事件折叠块 */
  details.followup {
    margin-top: 6px; border-left: 2px solid #2f4a63; padding-left: 10px;
  }
  details.followup > summary {
    cursor: pointer; color: #7fc4ff; font-size: 12.5px; padding: 2px 0;
    list-style: none;
  }
  details.followup > summary::-webkit-details-marker { display: none; }
  details.followup > summary:hover { text-decoration: underline; }
  details.followup[open] > summary { margin-bottom: 4px; }
  .fu-event {
    background: #141b24; border: 1px solid #233042; border-radius: 6px;
    padding: 8px 10px; margin: 4px 0;
  }
  .fu-event .fu-title { font-size: 13px; font-weight: 600; }
  .fu-event .fu-desc { color: var(--dim); font-size: 12px; margin: 3px 0 5px; }
  .fu-opt { padding: 3px 0; font-size: 12.5px; }
  .fu-opt .n { color: var(--dim); }
  .fu-pick {
    display: flex; gap: 8px; align-items: flex-start; cursor: pointer;
    padding: 4px 6px; border-radius: 5px; border: 1px solid transparent;
  }
  .fu-pick:hover { background: #1a2230; }
  .fu-opt.on > .fu-pick { background: #14301f; border-color: #2c6b45; }
  .fu-pick input { margin-top: 4px; }
  .fu-opt.on { color: #d7f5e2; }
  .seq-bar {
    display: flex; gap: 8px; align-items: center; margin: 4px 0 6px;
    padding: 5px 8px; border-radius: 5px; background: #1b2431;
    color: #8fa4bd; font-size: 12px;
  }
  .seq-clear {
    margin-left: auto; padding: 2px 8px; font-size: 11.5px;
    background: #2a1d1d; border-color: #4a2c2c; color: #e09a9a;
  }
  .seq-clear:hover { border-color: var(--bad); }
</style>
</head>
<body>
<header>
  <h1>卡厄思 · 事件偏好选择器</h1>
  <span id="stat" style="color:var(--dim);font-size:12.5px"></span>
  <span class="grow"></span>
  <button id="btn-export" class="primary">导出选择</button>
  <button id="btn-import">导入</button>
  <button id="btn-clear">清空</button>
  <input id="file" type="file" accept=".json" style="display:none">
</header>
<main>
  <nav id="nav"></nav>
  <section id="list"></section>
</main>
<footer>
  <span class="hint" id="hint">
    选中的事件会高亮；每个事件内只能选一个选项。导出后把文件放到
    <code>config/rogue/rogue_event_picks.json</code>
  </span>
</footer>
<script src="events.js"></script>
<script>
const STORE_KEY = 'czn_rogue_events_v1';
let DATA = null;
let PICKS = JSON.parse(localStorage.getItem(STORE_KEY) || '{}');
let ACTIVE = null;

function save() {
  localStorage.setItem(STORE_KEY, JSON.stringify(PICKS));
  updateStat();
}

function updateStat() {
  const total = Object.keys(PICKS).length;
  document.getElementById('stat').textContent = `已选 ${total} 个事件`;
}

function renderNav() {
  const nav = document.getElementById('nav');
  nav.innerHTML = '';
  DATA.packs.forEach(pack => {
    const picked = pack.events.filter(e => PICKS[e.id] !== undefined).length;
    const a = document.createElement('a');
    a.href = '#';
    a.dataset.pack = pack.id;
    a.className = (ACTIVE === pack.id ? 'active' : '');
    a.innerHTML = `${pack.common ? '★ ' : ''}${pack.name}`
      + `<span class="count">${picked}/${pack.events.length}</span>`;
    a.onclick = ev => { ev.preventDefault(); ACTIVE = pack.id; renderNav(); renderList(); };
    nav.appendChild(a);
  });
}

/* 一个事件是不是"会反复出现"（有选项指回自己）。
   全库实测 45 个自环（主事件 38 + 子事件 7），另有 4 组同组互跳。 */
function isLoopEvent(node) {
  return (node.options || []).some(option => option.next === node.id);
}

/* 取该事件已选的序列（数字也统一成数组）。 */
function pickSequence(nodeId) {
  const stored = PICKS[nodeId];
  if (Array.isArray(stored)) return stored;
  return stored === undefined ? [] : [stored];
}

/* 反复事件的进度条：显示 1 → 2 → 3 的已选顺序，带清空。 */
function loopBar(node, sequence, refresh) {
  const bar = document.createElement('div');
  bar.className = 'seq-bar';
  const label = document.createElement('span');
  label.textContent = sequence.length
    ? `本次顺序：${sequence.join(' → ')}（继续点会往后追加，脚本按轮次执行）`
    : '这个事件会反复出现：按顺序点选项，点一次 = 加一步';
  bar.appendChild(label);
  if (sequence.length) {
    const clear = document.createElement('button');
    clear.textContent = '清空';
    clear.className = 'seq-clear';
    clear.onclick = event => {
      event.preventDefault();
      delete PICKS[node.id];
      save(); refresh();
    };
    bar.appendChild(clear);
  }
  return bar;
}

/* 点一个选项：反复事件追加一步，普通事件单选/反选。 */
function applyPick(node, option, sequence) {
  if (isLoopEvent(node)) {
    PICKS[node.id] = sequence.concat([option.order]);
  } else if (PICKS[node.id] === option.order) {
    delete PICKS[node.id];
  } else {
    PICKS[node.id] = option.order;
  }
  save(); renderList(); renderNav();
}

/* 渲染「选了这一步之后会跳到的那个事件」，可多层嵌套（数据最多 2 层）。 */
function renderFollowUp(node, depth) {
  const box = document.createElement('div');
  box.className = 'fu-event';

  const title = document.createElement('div');
  title.className = 'fu-title';
  title.innerHTML = `${node.name || node.id}`
    + `<span class="rarity ${node.rarity || ''}">${node.rarity || ''}</span>`
    + `<span class="id" style="color:var(--dim);font-size:11px;margin-left:8px">${node.id}</span>`;
  box.appendChild(title);

  if (node.desc) {
    const desc = document.createElement('div');
    desc.className = 'fu-desc';
    desc.textContent = node.desc;
    box.appendChild(desc);
  }

  if (!node.options || !node.options.length) {
    const empty = document.createElement('div');
    empty.className = 'fu-desc';
    empty.textContent = '（这个事件没有可选分支，通常是剧情或到此结束）';
    box.appendChild(empty);
    return box;
  }

  // 自环事件（有选项会跳回自己）会出现**多次**，要按轮次选不同选项，
  // 比如虛無牧者：伸入深處 → 更深處 → 最深處 → 取出。用"点一次加一步"的序列。
  const isLoop = isLoopEvent(node);
  const sequence = pickSequence(node.id);
  if (isLoop) {
    box.appendChild(loopBar(node, sequence, () => { renderList(); renderNav(); }));
  }

  (node.options || []).forEach(option => {
    const row = document.createElement('div');
    const picked = isLoop
      ? sequence[sequence.length - 1] === option.order
      : PICKS[node.id] === option.order;
    row.className = 'fu-opt' + (picked ? ' on' : '');

    // 后续事件里的选项**也能直接勾选**：整条链在一个卡片里选完，
    // 不用"先去看子事件、再回来单独选"（用户 2026-11-15 要求）。
    const label = document.createElement('label');
    label.className = 'fu-pick';
    const input = document.createElement('input');
    input.type = 'radio';
    input.name = 'fu_' + node.id;
    input.checked = picked;
    // ❗用 onclick 不是 onchange：radio 被选中后再点同一个不会触发 change，
    // 而"反复事件"正需要**连续点同一项多次**（比如连续两次"伸入深處"）。
    input.onclick = () => applyPick(node, option, sequence);

    const body = document.createElement('div');
    body.style.flex = '1';
    let tags = '';
    if (option.dice) tags += `<span class="tag dice">骰 ${option.dice}</span>`;
    let text = `<span class="n">${option.order}.</span> ${option.text || '（空）'}${tags}`;
    if (option.success) text += `<div class="eff"><span class="s">成</span> ${option.success}</div>`;
    if (option.fail) text += `<div class="eff"><span class="f">败</span> ${option.fail}</div>`;
    body.innerHTML = text;

    if (option.next && depth < 2) {
      const details = document.createElement('details');
      details.className = 'followup';
      details.innerHTML = '<summary>→ 后续：' + (option.next.name || option.next.id) + '</summary>';
      details.appendChild(renderFollowUp(option.next, depth + 1));
      body.appendChild(details);
    }

    label.appendChild(input);
    label.appendChild(body);
    row.appendChild(label);
    box.appendChild(row);
  });
  return box;
}

function renderList() {
  const list = document.getElementById('list');
  const pack = DATA.packs.find(p => p.id === ACTIVE);
  if (!pack) { list.innerHTML = '<div class="empty">左侧选一张地图</div>'; return; }
  list.innerHTML = '';
  const h2 = document.createElement('h2');
  h2.textContent = `${pack.name}　共 ${pack.events.length} 个事件`
    + (pack.common ? '　（通用：所有地图都会出现）' : '');
  list.appendChild(h2);

  pack.events.forEach(event => {
    const box = document.createElement('div');
    box.className = 'event' + (PICKS[event.id] !== undefined ? ' picked' : '');

    const title = document.createElement('h3');
    title.innerHTML = `${event.name}<span class="rarity ${event.rarity}">${event.rarity}</span>`
      + `<span class="id">${event.id}</span>`;
    box.appendChild(title);

    if (event.desc) {
      const desc = document.createElement('div');
      desc.className = 'desc';
      desc.textContent = event.desc;
      box.appendChild(desc);
    }

    // 主事件同样要支持"反复"（全库 27 个主事件自环，例如「食客」餵食后回到自己）。
    // 之前只在后续详情里做了序列模式，主事件还是单选，等于漏了一大半。
    const isLoop = isLoopEvent(event);
    const sequence = pickSequence(event.id);
    if (isLoop) {
      box.appendChild(loopBar(event, sequence, () => { renderList(); renderNav(); }));
    }

    event.options.forEach(option => {
      const picked = isLoop
        ? sequence[sequence.length - 1] === option.order
        : PICKS[event.id] === option.order;
      const row = document.createElement('label');
      row.className = 'opt' + (picked ? ' on' : '');
      const input = document.createElement('input');
      input.type = 'radio';
      input.name = 'ev_' + event.id;
      input.checked = picked;
      input.onclick = () => applyPick(event, option, sequence);

      const body = document.createElement('div');
      body.className = 'body';
      let tags = '';
      if (option.dice) tags += `<span class="tag dice">骰 ${option.dice}</span>`;
      if (option.condition) tags += `<span class="tag cond">${option.condition}</span>`;
      if (option.attack) tags += `<span class="tag attack">战斗</span>`;
      if (option.next) tags += `<span class="tag next">→ 后续</span>`;

      let eff = '';
      if (option.success) eff += `<div class="eff"><span class="s">成</span> ${option.success}</div>`;
      if (option.fail) eff += `<div class="eff"><span class="f">败</span> ${option.fail}</div>`;

      body.innerHTML = `<div class="txt">${option.order}. ${option.text || '（空）'}${tags}</div>${eff}`;
      // 「→ 后续」不只是个提示：展开能看到那个事件完整的选项和奖励
      if (option.nextDetail) {
        const details = document.createElement('details');
        details.className = 'followup';
        // 有可选项时**默认展开**：整条链要能在一个卡片里选完，
        // 缩起来等于又变成"看一个、再另选一个"（用户 2026-11-15 要求）。
        const hasChoices = (option.nextDetail.options || []).length > 0;
        if (hasChoices) details.open = true;
        details.innerHTML = '<summary>→ 后续：'
          + (option.nextDetail.name || option.nextDetail.id)
          + (hasChoices ? '（可直接在这里选）' : '') + '</summary>';
        details.appendChild(renderFollowUp(option.nextDetail, 0));
        body.appendChild(details);
      }
      row.appendChild(input);
      row.appendChild(body);
      box.appendChild(row);
    });

    list.appendChild(box);
  });
}

function exportPicks() {
  const payload = {
    generated: new Date().toISOString(),
    version: 1,
    picks: {}
  };
  Object.keys(PICKS).forEach(id => { payload.picks[id] = PICKS[id]; });
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'rogue_event_picks.json';
  a.click();
  URL.revokeObjectURL(a.href);
}

function importPicks(file) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const parsed = JSON.parse(reader.result);
      PICKS = parsed.picks || parsed || {};
      save(); renderNav(); renderList();
      document.getElementById('hint').textContent =
        `已导入 ${Object.keys(PICKS).length} 条选择`;
    } catch (error) {
      document.getElementById('hint').textContent = '导入失败：' + error.message;
    }
  };
  reader.readAsText(file);
}

const doc = window.EVENTS_DATA;
if (!doc) {
  document.getElementById('list').innerHTML =
    '<div class="empty">没读到 events.js。请确认它和 index.html 在同一个目录。</div>';
} else {
  DATA = doc;
  ACTIVE = DATA.packs[0] && DATA.packs[0].id;
  renderNav(); renderList(); updateStat();
}

document.getElementById('btn-export').onclick = exportPicks;
document.getElementById('btn-clear').onclick = () => {
  if (confirm('清空所有已选事件？')) { PICKS = {}; save(); renderNav(); renderList(); }
};
document.getElementById('btn-import').onclick = () => document.getElementById('file').click();
document.getElementById('file').onchange = ev => {
  if (ev.target.files[0]) { importPicks(ev.target.files[0]); }
};
</script>
</body>
</html>
